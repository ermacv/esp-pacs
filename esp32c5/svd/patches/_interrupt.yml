INTERRUPT_CORE0:
  _modify:
    INT_STATUS_0:
      addressOffset: 0x150
    INT_STATUS_1:
      addressOffset: 0x154
    INT_STATUS_2:
      addressOffset: 0x158
  _array:
    INT_STATUS_*:
      name: CORE_0_INTR_STATUS%s
      description: "Represents the status of the interrupt sources. Each bit corresponds to one interrupt source"

  _delete:
    - "*_MAP"
    - CLOCK_GATE

  _add:
    # Sources ESP-IDF's soc/interrupts.h defines that no other peripheral
    # declares.
    _interrupts:
      LP_PERI_TIMEOUT:
        value: 19
      HP_PERI_TIMEOUT:
        value: 34
      MODEM_PERI_TIMEOUT:
        value: 35
      SLC0:
        value: 69
      SLC1:
        value: 70
      KM:
        value: 83
    CORE_0_INTR_MAP%s:
      addressOffset: 0
      dim: 84 # last register is at 0x14C
      dimIncrement: 4
      access: read-write
      size: 32
      resetValue: 0
      fields:
        MAP:
          bitOffset: 0
          bitWidth: 6
          access: read-write
        PASS_IN_SEC:
          bitOffset: 8
          bitWidth: 1
          access: read-write
