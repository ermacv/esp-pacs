GPIO:
  _delete:
    - FUNC*_IN_SEL_CFG
  _add:
    FUNC%s_IN_SEL_CFG:
      dim: 256
      dimIncrement: 0x04
      dimIndex: 0-255
      description: GPIO input function configuration register
      addressOffset: 0x2f4
      access: read-write
      reset-value: 0x80
      size: 0x20
      fields:
        IN_SEL:
          description: "Configures to select a pin from the 63 GPIO pins to connect the input signal %s."
          bitOffset: 0
          bitWidth: 8
        IN_INV_SEL:
          description: "Configures whether or not to invert the input value. 0: Not invert. 1: Invert."
          bitOffset: 8
          bitWidth: 1
        SEL:
          description: "Configures whether or not to route signals via GPIO matrix. 0: Bypass GPIO matrix. 1: Route via GPIO matrix."
          bitOffset: 9
          bitWidth: 1

  FUNC%s_OUT_SEL_CFG:
    _modify:
      FUNC_OUT_SEL:
        name: OUT_SEL
      FUNC_OUT_INV_SEL:
        name: INV_SEL
      FUNC_OE_SEL:
        name: OEN_SEL
      FUNC_OE_INV_SEL:
        name: OEN_INV_SEL
