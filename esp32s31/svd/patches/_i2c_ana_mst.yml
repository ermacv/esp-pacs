_add:
  I2C_ANA_MST:
    description: I2C_ANA_MST Peripheral
    baseAddress: 0x2010F800
    addressBlock:
      - offset: 0x0
        size: 0x40
        usage: Registers
    registers:

      I2C0_CTRL:
        description: >-
          Analog-register I2C host-0 command and completion word.
          SOURCE[ROM_REV0_PHY_I2C]; complete phy_i2c_master_reset,
          phy_chip_i2c_readReg_org and phy_chip_i2c_writeReg bodies.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x00000000
        fields:
          SLAVE_ADDR:
            description: Analog block identifier.
            bitOffset: 0
            bitWidth: 8
            writeConstraint: [0, 0xff]
          SLAVE_REG_ADDR:
            description: Register address within the selected analog block.
            bitOffset: 8
            bitWidth: 8
            writeConstraint: [0, 0xff]
          DATA:
            description: Write data or completed read result.
            bitOffset: 16
            bitWidth: 8
            writeConstraint: [0, 0xff]
          READ_WRITE:
            description: Write transaction when set; read transaction when clear.
            bitOffset: 24
            bitWidth: 1
          BUSY:
            description: Hardware transaction busy status.
            bitOffset: 25
            bitWidth: 1
          START_OR_RESET:
            description: >-
              Transaction-start command, or the one-bit host reset word when
              written without the address/data fields.
            bitOffset: 26
            bitWidth: 1

      I2C1_CTRL:
        description: >-
          Analog-register I2C host-1 command and completion word.
          SOURCE[ROM_REV0_PHY_I2C]; complete phy_i2c_master_reset,
          phy_chip_i2c_readReg_org and phy_chip_i2c_writeReg bodies.
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x00000000
        fields:
          SLAVE_ADDR:
            description: Analog block identifier.
            bitOffset: 0
            bitWidth: 8
            writeConstraint: [0, 0xff]
          SLAVE_REG_ADDR:
            description: Register address within the selected analog block.
            bitOffset: 8
            bitWidth: 8
            writeConstraint: [0, 0xff]
          DATA:
            description: Write data or completed read result.
            bitOffset: 16
            bitWidth: 8
            writeConstraint: [0, 0xff]
          READ_WRITE:
            description: Write transaction when set; read transaction when clear.
            bitOffset: 24
            bitWidth: 1
          BUSY:
            description: Hardware transaction busy status.
            bitOffset: 25
            bitWidth: 1
          START_OR_RESET:
            description: >-
              Transaction-start command, or the one-bit host reset word when
              written without the address/data fields.
            bitOffset: 26
            bitWidth: 1

      I2C0_CONF:
        description: I2C0_CONF
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x00000000
        fields:
          I2C0_CONF:
            bitOffset: 0
            bitWidth: 24
          I2C0_STATUS:
            bitOffset: 24
            bitWidth: 8

      I2C1_CONF:
        description: I2C1_CONF
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x00000000
        fields:
          I2C1_CONF:
            bitOffset: 0
            bitWidth: 24
          I2C1_STATUS:
            bitOffset: 24
            bitWidth: 8

      I2C_BURST_CONF:
        description: I2C_BURST_CONF
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x00000000
        fields:
          I2C_MST_BURST_CTRL:
            bitOffset: 0
            bitWidth: 32

      I2C_BURST_STATUS:
        description: I2C_BURST_STATUS
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x40000000
        fields:
          I2C_MST_BURST_DONE:
            bitOffset: 0
            bitWidth: 1
          I2C_MST0_BURST_ERR_FLAG:
            bitOffset: 1
            bitWidth: 1
          I2C_MST1_BURST_ERR_FLAG:
            bitOffset: 2
            bitWidth: 1
          I2C_MST_BURST_TIMEOUT_CNT:
            bitOffset: 20
            bitWidth: 12

      ANA_CONF0:
        description: >-
          Shared analog-I2C master control. SOURCE[ROM_REV0_PHY_I2C];
          complete phy_i2cmst_reg_init and phy_bbpll_cal bodies identify the
          PHY register-mode and BBPLL calibration fields.
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x0000E408
        fields:
          BBPLL_CAL_MODE_UNKNOWN:
            description: >-
              BBPLL calibration selection. Complete phy_bbpll_cal uses only
              encoding 1 (disabled) and encoding 2 (enabled).
            bitOffset: 2
            bitWidth: 2
            writeConstraint: [0, 3]
          PHY_REGISTER_ENABLE:
            description: >-
              Enable PHY analog-register master mode; set by complete
              phy_i2cmst_reg_init after selecting mode 2.
            bitOffset: 6
            bitWidth: 1
          PHY_REGISTER_MODE:
            description: >-
              PHY analog-register master mode; complete phy_i2cmst_reg_init
              selects encoding 2.
            bitOffset: 9
            bitWidth: 2
            writeConstraint: [0, 3]
          ANA_STATUS0:
            bitOffset: 24
            bitWidth: 8

      ANA_CONF1:
        description: >-
          Shared analog-I2C routing/read-mask word. SOURCE[BLOB_LIBPHY_PHY_I2C];
          phy_i2c_get_reg_mask publishes the complement of the selected
          16-bit block mask. ESP32-S31 regi2c routing also consumes the low
          24-bit configuration image.
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0x0000002D
        fields:
          ANA_CONF1:
            bitOffset: 0
            bitWidth: 24
            writeConstraint: [0, 0xffffff]
          ANA_STATUS1:
            bitOffset: 24
            bitWidth: 8
            writeConstraint: [0, 0xff]

      ANA_CONF2:
        description: >-
          Shared analog-I2C host-selection word. SOURCE[BLOB_LIBPHY_PHY_I2C];
          the S31 host callback replaces bits 17:4 with 0x3fa0. The internal
          subfield meanings remain unknown.
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0x00000004
        fields:
          ANA_CONF2:
            bitOffset: 0
            bitWidth: 24
            writeConstraint: [0, 0xffffff]
          ANA_STATUS2:
            bitOffset: 24
            bitWidth: 8

      I2C0_CTRL1:
        description: >-
          Host-0 timing/clock-selection control. SOURCE[ROM_REV0_PHY_I2C];
          complete phy_i2c_clk_sel updates the five-bit high field and then
          the six-bit low field using separate fresh reads.
        addressOffset: 0x24
        size: 32
        access: read-write
        resetValue: 0x00000042
        fields:
          I2C0_SCL_PULSE_DUR:
            bitOffset: 0
            bitWidth: 6
            writeConstraint: [0, 0x3f]
          I2C0_SDA_SIDE_GUARD:
            bitOffset: 6
            bitWidth: 5
            writeConstraint: [0, 0x1f]

      I2C1_CTRL1:
        description: >-
          Host-1 timing/clock-selection control. SOURCE[ROM_REV0_PHY_I2C];
          complete phy_i2c_clk_sel updates the five-bit high field and then
          the six-bit low field using separate fresh reads.
        addressOffset: 0x28
        size: 32
        access: read-write
        resetValue: 0x00000042
        fields:
          I2C1_SCL_PULSE_DUR:
            bitOffset: 0
            bitWidth: 6
            writeConstraint: [0, 0x3f]
          I2C1_SDA_SIDE_GUARD:
            bitOffset: 6
            bitWidth: 5
            writeConstraint: [0, 0x1f]

      HW_I2C_CTRL:
        description: >-
          Hardware-host timing/clock-selection control.
          SOURCE[ROM_REV0_PHY_I2C]; complete phy_i2c_clk_sel updates the
          five-bit high field and then the six-bit low field using separate
          fresh reads.
        addressOffset: 0x2C
        size: 32
        access: read-write
        resetValue: 0x00000042
        fields:
          HW_I2C_SCL_PULSE_DUR:
            bitOffset: 0
            bitWidth: 6
            writeConstraint: [0, 0x3f]
          HW_I2C_SDA_SIDE_GUARD:
            bitOffset: 6
            bitWidth: 5
            writeConstraint: [0, 0x1f]
          ARBITER_DIS:
            bitOffset: 11
            bitWidth: 1

      I2C_MST_NOUSE:
        description: I2C_MST_NOUSE
        addressOffset: 0x30
        size: 32
        access: read-write
        resetValue: 0x00000000
        fields:
          I2C_MST_NOUSE:
            bitOffset: 0
            bitWidth: 32

      EXT_I2C_MASK:
        description: EXT_I2C_MASK
        addressOffset: 0x34
        size: 32
        access: read-write
        resetValue: 0x00000000
        fields:
          EXT_I2C_SDA_I_MASK:
            bitOffset: 0
            bitWidth: 16
          EXT_I2C_SDA_O_MASK:
            bitOffset: 16
            bitWidth: 16

      I2C_MASK:
        description: I2C_MASK
        addressOffset: 0x38
        size: 32
        access: read-write
        resetValue: 0x00000000
        fields:
          I2C_SDA_I_MASK:
            bitOffset: 0
            bitWidth: 16
          I2C_SDA_O_MASK:
            bitOffset: 16
            bitWidth: 16

      DATE:
        description: DATE
        addressOffset: 0x3C
        size: 32
        access: read-write
        resetValue: 0x02411290
        fields:
          DATE:
            bitOffset: 0
            bitWidth: 28
          CLK_EN:
            bitOffset: 28
            bitWidth: 1
