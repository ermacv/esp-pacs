        description: >-
          SOURCE[ROM_REV0_PHY_OPEN_FE_BB_CLK];
          CONFIDENCE[instruction-exact-semantics-unknown]. The complete ESP32-S31
          rev0 ROM phy_open_fe_bb_clk body sets bits 3:0; their individual
          meanings remain unknown.
        bitOffset: 0
        bitWidth: 4
        access: read-write
      HP_ACTIVE_XPD_BBPLL_I2C:
        bitOffset: 24
        bitWidth: 1
        access: read-write
      HP_ACTIVE_XPD_APLL_I2C:
        bitOffset: 25
        bitWidth: 1
        access: read-write
