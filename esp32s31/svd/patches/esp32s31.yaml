_svd: "../esp32s31.base.svd"

_include:
  - "_clic.yml"
  - "_gpio.yml"
  - "_ecc.yml"
  - "_sha.yml"

_add:
  PSRAM_MSPI:
    description: "System MSPI controller for external PSRAM"
    derivedFrom: SPI0
    baseAddress: 0x20502000
  CNNT_SYS:
    description: "Connectivity subsystem clock, reset, and interface control"
    baseAddress: 0x20359000
    interrupts:
      WIFI_MAC:
        description: Wi-Fi MAC interrupt
        value: 120
      WIFI_MAC_NMI:
        description: Wi-Fi MAC non-maskable interrupt source
        value: 121
      WIFI_PWR:
        description: Wi-Fi power interrupt
        value: 122
      WIFI_BB:
        description: Wi-Fi baseband interrupt
        value: 123
    addressBlock:
      - offset: 0x0
        size: 0x64
        usage: "Registers"
    registers:
      HP_EMAC_CTRL:
        description: "EMAC reset control"
        addressOffset: 0x3c
        size: 0x20
        access: read-write
        fields:
          EMAC_USELESS_CLK_EN:
            bitOffset: 0
            bitWidth: 1
          EMAC_RST_EN:
            bitOffset: 1
            bitWidth: 1
          EMAC_FORCE_NORST:
            bitOffset: 2
            bitWidth: 1
      HP_EMAC_REF_CTRL:
        description: "EMAC reference clock control"
        addressOffset: 0x40
        size: 0x20
        access: read-write
        fields:
          EMAC_REF_CLK_SEL:
            description: "Reference clock source: 0 = MPLL 500 MHz, 1 = CPLL 300 MHz"
            bitOffset: 0
            bitWidth: 2
          EMAC_REF_CLK_EN:
            bitOffset: 2
            bitWidth: 1
          EMAC_REF_50M_PAD_OUT_CLK_EN:
            bitOffset: 3
            bitWidth: 1
          EMAC_REF_CLK_DIV_NUM:
            bitOffset: 8
            bitWidth: 8
      HP_EMAC_RMII_PAD_CTRL:
        description: "EMAC RMII pad clock control"
        addressOffset: 0x44
        size: 0x20
        access: read-write
        fields:
          EMAC_RMII_PAD_CLK_EN:
            bitOffset: 1
            bitWidth: 1
          EMAC_RMII_PAD_CLK_INV_EN:
            bitOffset: 2
            bitWidth: 1
      HP_EMAC_RMII_CTRL:
        description: "EMAC RMII clock control"
        addressOffset: 0x48
        size: 0x20
        access: read-write
        fields:
          EMAC_RMII_CLK_SEL:
            bitOffset: 0
            bitWidth: 1
          EMAC_RMII_CLK_EN:
            bitOffset: 1
            bitWidth: 1
          EMAC_RMII_PAD_OUT_CLK_EN:
            bitOffset: 2
            bitWidth: 1
          EMAC_RXTX_CLK_DIV_NUM:
            bitOffset: 8
            bitWidth: 5
      HP_EMAC_RX_CTRL:
        description: "EMAC receive clock control"
        addressOffset: 0x4c
        size: 0x20
        access: read-write
        fields:
          EMAC_RX_PAD_CLK_EN:
            bitOffset: 0
            bitWidth: 1
          EMAC_RX_PAD_CLK_INV_EN:
            bitOffset: 1
            bitWidth: 1
          EMAC_RX_CLK_SEL:
            bitOffset: 2
            bitWidth: 1
          EMAC_RX_180_CLK_EN:
            bitOffset: 3
            bitWidth: 1
      HP_EMAC_TX_CTRL:
        description: "EMAC transmit clock control"
        addressOffset: 0x50
        size: 0x20
        access: read-write
        fields:
          EMAC_TX_PAD_CLK_EN:
            bitOffset: 0
            bitWidth: 1
          EMAC_TX_PAD_CLK_INV_EN:
            bitOffset: 1
            bitWidth: 1
          EMAC_TX_CLK_SEL:
            bitOffset: 2
            bitWidth: 1
          EMAC_TX_180_CLK_EN:
            bitOffset: 3
            bitWidth: 1
      GMAC_CTRL0:
        description: "GMAC interface and low-power control"
        addressOffset: 0x60
        size: 0x20
        access: read-write
        fields:
          SBD_FLOWCTRL:
            bitOffset: 1
            bitWidth: 1
          PHY_INTF_SEL:
            bitOffset: 2
            bitWidth: 3
          GMAC_MEM_CLK_FORCE_ON:
            bitOffset: 5
            bitWidth: 1
          GMAC_CSYSREQ:
            bitOffset: 10
            bitWidth: 1

PMU:
  _include: ../../../common_patches/pmu_int_strip.yaml

ADC:
  DMA_CONF:
    _strip: APB_
  _include: ../../../common_patches/int_strip.yaml

AES:
  _modify:
    INT_CLEAR:
      name: INT_CLR

  KEY_%s:
    _modify:
      KEY_0:
        name: KEY
    KEY: [0, 0xffff_ffff]
  TEXT_IN_%s:
    _modify:
      TEXT_IN_0:
        name: TEXT_IN
    TEXT_IN: [0, 0xffff_ffff]
  TEXT_OUT_%s:
    _modify:
      TEXT_OUT_0:
        name: TEXT_OUT
  INT_CLR:
    _modify:
      INT_CLEAR:
        name: INT_CLR

ECC:
  _include: ../../../common_patches/ecc_int_strip.yaml

EFUSE:
  _strip: APB2OTP_
  "*":
    _strip: APB2OTP_

GPIO:
  _modify:
    _interrupts:
      GPIO_INT0:
        name: GPIO

GPIO_EXT:
  _include: ../../../common_patches/gpiosd_ext.yaml

GMAC:
  REGISTER1_TRANSMITPOLLDEMANDREGISTER:
    _modify:
      TPD:
        access: write-only
  REGISTER2_RECEIVEPOLLDEMANDREGISTER:
    _modify:
      RPD:
        access: write-only

HP_SYS:
  _add:
    _interrupts:
      FROM_CPU_INTR0:
        value: 65
      FROM_CPU_INTR1:
        value: 66
      FROM_CPU_INTR2:
        value: 67
      FROM_CPU_INTR3:
        value: 68
  _modify:
    HP_CPU_INT_FROM_CPU_0:
      name: CPU_INTR_FROM_CPU_0
    HP_CPU_INT_FROM_CPU_1:
      name: CPU_INTR_FROM_CPU_1
    HP_CPU_INT_FROM_CPU_2:
      name: CPU_INTR_FROM_CPU_2
    HP_CPU_INT_FROM_CPU_3:
      name: CPU_INTR_FROM_CPU_3
  CPU_INTR_FROM_CPU_0:
    _modify:
      HP_CPU_INT_FROM_CPU_0:
        name: CPU_INTR_FROM_CPU_0
  CPU_INTR_FROM_CPU_1:
    _modify:
      HP_CPU_INT_FROM_CPU_1:
        name: CPU_INTR_FROM_CPU_1
  CPU_INTR_FROM_CPU_2:
    _modify:
      HP_CPU_INT_FROM_CPU_2:
        name: CPU_INTR_FROM_CPU_2
  CPU_INTR_FROM_CPU_3:
    _modify:
      HP_CPU_INT_FROM_CPU_3:
        name: CPU_INTR_FROM_CPU_3
  _include: ../../../common_patches/sw_interrupts.yaml

JPEG:
  _include: ../../../common_patches/int_strip.yaml
  _array:
    C?: {}

"SPI[01]":
  _strip: SPI_MEM_
  "*":
    _strip: SPI_MEM_

SPI2:
  _strip: SPI_
  "*":
    _strip: SPI_
  _include: ../../../common_patches/spi_dma_int_strip.yaml

  CMD:
    _modify:
      UPDATE:
        access: read-write

SOC_ETM:
  CH_ENA_AD?:
    _array:
      CH_ENABLED*:
        name: CH_ENA%s
  CH_ENA_AD?_SET:
    _array:
      CH_ENABLE*:
        name: CH_SET%s
  CH_ENA_AD?_CLR:
    _array:
      CH_DISABLE*:
        name: CH_CLR%s
  _expand_array:
    CH%s_EVT_ID: {}
    CH%s_TASK_ID: {}

  _cluster:
    CH%s:
      "CH*_EVT_ID":
        name: EVT_ID
        _modify:
          "CH*_EVT_ID":
            name: EVT_ID
      "CH*_TASK_ID":
        name: TASK_ID
        _modify:
          "CH*_TASK_ID":
            name: TASK_ID


I2C0:
  _modify:
    INT_STATUS:
      name: INT_ST

  DATA:
    _modify:
      FIFO_RDATA:
        access: read-write
  _include:
    - ../../../common_patches/i2c_force_out.yaml
    - ../../../common_patches/i2c0.yaml
    - ../../../common_patches/i2c_st_timeouts.yaml

LEDC0:
  _include:
    - ../../../common_patches/ledc_collect.yaml
    - ../../../common_patches/ledc_int.yaml

LP_APM:
  _cluster:
    M%s:
      dimIncrement: 16
      M?_STATUS:
        name: STATUS
        _strip: M0_
      M?_STATUS_CLR:
        name: STATUS_CLR
        _strip: M0_
      M?_EXCEPTION_INFO0:
        name: EXCEPTION_INFO0
        _strip: M0_
      M?_EXCEPTION_INFO1:
        name: EXCEPTION_INFO1
        _strip: M0_

  FUNC_CTRL:
    _array:
      M?_FUNC_EN: {}
  INT_EN:
    _array:
      M?_APM_INT_EN:
        name: M%s_APM

LP_TIMER:
  _include: ../../../common_patches/lptim_int_strip.yaml

UART0:
  _strip_end: "_SYNC"

  CLKDIV:
    _modify:
      CLKDIV_FRAG:
        name: FRAG

  FIFO:
    _modify:
      RXFIFO_RD_BYTE:
        access: read-write
  _include: ../../../common_patches/int_strip.yaml


UHCI0:
  _include:
    - ../../../common_patches/uhci_collect.yaml
    - ../../../common_patches/int_strip.yaml

TIMG0:
  _include: ../../../common_patches/tim_collect.yaml
  _modify:
    _interrupts:
      TG0_T0:
        name: TG0_T0_LEVEL
      TG0_T1:
        name: TG0_T1_LEVEL
      TG0_WDT:
        name: TG0_WDT_LEVEL


"EFUSE,I2C0,I2S0,UART0,SPI[01],USB_DEVICE,LP_UART,LP_WDT,PARL_IO,PAU,PMU,MCPWM0":
  _include: ../../../common_patches/int_strip.yaml


_modify:
  BUS_MONITOR:
    name: ASSIST_DEBUG
    description: ASSIST_DEBUG (BUS_MONITOR) Peripheral
    groupName: ASSIST_DEBUG
  SPI?:
    groupName: SPI
